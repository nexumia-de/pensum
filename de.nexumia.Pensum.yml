id: de.nexumia.Pensum
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: pensum
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Network only to read a Super Productivity sync folder on a WebDAV
  # server (docs/super-productivity-sync.md); its password goes to the
  # keyring through the Secret portal. No file system access: the
  # dataset lives in the app's own data directory; backups and local
  # sync folders are opened through the file chooser portal
  # (docs/super-productivity-data.md).
  - --share=network
cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'
  - '*.la'
# Everything else Pensum needs is in the GNOME runtime (GTK, libadwaita,
# Python). Inventory: docs/dependencies.md.
modules:
  # Shared settings and style code (phosh-toolkit
  # docs/shared-connection.md), next to Pensum's package in site-packages.
  - name: phosh-toolkit
    buildsystem: simple
    build-commands:
      - install -Dm644 -t "$(python3 -c 'import sysconfig; print(sysconfig.get_path("purelib", vars={"base":"/app"}))')/phosh_toolkit" lib/phosh_toolkit/*.py
      - install -Dm644 -t /app/share/licenses/$FLATPAK_ID/phosh-toolkit LICENSE
    sources:
      - type: git
        url: https://github.com/nexumia-de/phosh-toolkit.git
        tag: v0.3.0
        commit: c29a2a106dd2328c24d0201f1cc31f7da7c695f2
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
  # QuestArc's engine and journeys, run by the runtime's gjs (docs/journeys.md).
  - name: questarc-engine
    buildsystem: simple
    build-commands:
      - install -Dm644 -t /app/share/questarc engine.mjs engine-cli.mjs
      - cp -r content /app/share/questarc/
      - install -Dm644 LICENSE /app/share/licenses/$FLATPAK_ID/questarc-engine/LICENSE
      - install -Dm644 content/LICENSE /app/share/licenses/$FLATPAK_ID/questarc-journeys/LICENSE
    sources:
      - type: archive
        url: https://github.com/nexumia-de/QuestArc/releases/download/v3.1.0/questarc-engine-3.1.0.tar.gz
        sha256: acb5a47fe734d44705697814d754bd3be66885d3f538cfdc39f534d6aca9346d
        x-checker-data:
          type: json
          url: https://api.github.com/repos/nexumia-de/QuestArc/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("^questarc-engine-.*\\.tar\\.gz$")) | .browser_download_url
  - name: pensum
    buildsystem: meson
    sources:
      - type: dir
        path: .
        skip:
          - build-dir
          - repo
          - tests
          - .phosh-toolkit
          - .questarc
