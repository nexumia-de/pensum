name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The shared package at the commit the Flatpak manifest pins.
      - name: Find the pinned phosh-toolkit
        id: toolkit
        run: |
          commit=$(sed -n '/- name: phosh-toolkit/,/commit:/s/^ *commit: *//p' de.nexumia.Pensum.yml)
          [ -n "$commit" ] || { echo "::error::No phosh-toolkit commit in the manifest"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nexumia-de/phosh-toolkit
          ref: ${{ steps.toolkit.outputs.commit }}
          path: .phosh-toolkit
      # QuestArc's engine and journeys at the release the Flatpak manifest
      # pins (docs/journeys.md); the engine tests then must run.
      - name: Fetch the pinned QuestArc engine
        id: questarc
        run: |
          url=$(sed -n '/- name: questarc-engine/,/sha256:/s/^ *url: *//p' de.nexumia.Pensum.yml)
          sha=$(sed -n '/- name: questarc-engine/,/sha256:/s/^ *sha256: *//p' de.nexumia.Pensum.yml)
          if [ -z "$url" ]; then echo "No QuestArc engine pinned in the manifest"; exit 0; fi
          curl -sSfL --retry 3 -o questarc.tar.gz "$url"
          echo "$sha  questarc.tar.gz" | sha256sum -c -
          mkdir -p .questarc
          tar -xzf questarc.tar.gz -C .questarc --strip-components=1
          echo "dir=$PWD/.questarc" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: |
          apt=(sudo env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120)
          "${apt[@]}" update -q
          "${apt[@]}" install -y -q --no-install-recommends \
            python3-pytest python3-gi python3-gi-cairo python3-cffi gir1.2-gtk-4.0 gir1.2-adw-1 gjs \
            xvfb xauth appstream desktop-file-utils
          # Argon2id for encrypted sync files (#29), pinned; not in Ubuntu.
          /usr/bin/python3 -m pip install --user --break-system-packages --no-deps -r tests/requirements.txt
      - name: Validate metadata
        run: |
          desktop-file-validate data/*.desktop
          appstreamcli validate --no-net data/*.metainfo.xml
          grep -Eiq '^X-Purism-FormFactor=.*mobile;' data/*.desktop
      # test_ui.py drives the real widgets and needs a display.
      - name: Run tests
        env:
          PYTHONPATH: .phosh-toolkit/lib
          PENSUM_QUESTARC_DIR: ${{ steps.questarc.outputs.dir }}
          PENSUM_REQUIRE_ENGINE: ${{ steps.questarc.outputs.dir != '' && '1' || '' }}
        run: xvfb-run -a /usr/bin/python3 -m pytest -v

  # Pensum's exports imported into a real Super Productivity (the pinned
  # Docker image in tests/real_app/Dockerfile): no repair, the data as
  # written, and its export read back into Pensum clean
  # (docs/super-productivity-data.md, docs/dev-environment.md). Then the
  # sync test: Super Productivity syncs to a WebDAV test server and
  # Pensum reads the folder, read-only (docs/super-productivity-sync.md).
  real-app:
    name: real-app
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The shared package at the commit the Flatpak manifest pins
      # (pensum.store.files, used by the sync test's import check).
      - name: Find the pinned phosh-toolkit
        id: toolkit
        run: |
          commit=$(sed -n '/- name: phosh-toolkit/,/commit:/s/^ *commit: *//p' de.nexumia.Pensum.yml)
          [ -n "$commit" ] || { echo "::error::No phosh-toolkit commit in the manifest"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nexumia-de/phosh-toolkit
          ref: ${{ steps.toolkit.outputs.commit }}
          path: .phosh-toolkit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Playwright with Chromium
        working-directory: tests/real_app
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start Super Productivity at the pinned version
        run: |
          docker build -t pensum-sp tests/real_app
          docker run -d -p 8080:80 pensum-sp
          timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:8080/; do sleep 2; done'
      - name: Import Pensum's exports and read them back
        env:
          PENSUM_SP_URL: http://localhost:8080/
          PYTHON: /usr/bin/python3
        run: tests/real_app/run.sh tests/real_app/out
      - name: Install the WebDAV test server
        run: |
          python3 -m venv /tmp/webdav
          /tmp/webdav/bin/pip install --no-deps -r tests/real_app/requirements-webdav.txt
          sudo apt-get install -y -q --no-install-recommends python3-cffi
          /usr/bin/python3 -m pip install --user --break-system-packages --no-deps -r tests/requirements.txt
      - name: Sync with Super Productivity over WebDAV and read the folder
        env:
          PENSUM_SP_URL: http://localhost:8080/
          PYTHON: /usr/bin/python3
          WSGIDAV: /tmp/webdav/bin/wsgidav
        run: tests/real_app/run_sync.sh tests/real_app/out-sync
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: real-app-files
          path: |
            tests/real_app/out/
            tests/real_app/out-sync/
            !tests/real_app/out-sync/*/profile/
          if-no-files-found: ignore
