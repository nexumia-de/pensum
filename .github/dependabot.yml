# Weekly pull requests for new versions of the GitHub Actions used here.
# Flatpak modules are updated by the update-check workflow instead (see
# phosh-toolkit docs/dependency-updates.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # Playwright and the Super Productivity image of the real-app test.
  - package-ecosystem: npm
    directory: /tests/real_app
    schedule:
      interval: weekly
    versioning-strategy: increase
  - package-ecosystem: docker
    directory: /tests/real_app
    schedule:
      interval: weekly
  # The WebDAV test server of the sync test.
  - package-ecosystem: pip
    directory: /tests/real_app
    schedule:
      interval: weekly
  # Python modules of the tests (Argon2id bindings).
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
