# Checks before every commit (phosh-toolkit docs/toolkit-usage.md,
# "Pre-commit hooks"). Copy to the root of a new app repository;
# phosh-toolkit's setup.sh installs the hooks.
repos:
  - repo: https://github.com/nexumia-de/phosh-toolkit
    # The commit of the toolkit tag the app's workflows pin.
    rev: 1910057162098f0963b44623e91b3650f685c49b  # frozen: v0.8.1
    hooks:
      - id: phosh-metadata
      - id: phosh-changelog
  - repo: https://github.com/fsfe/reuse-tool
    rev: ea739bff9c6daa1c4c8a5c5dfd069f3fb0374728  # frozen: v6.3.0
    hooks:
      - id: reuse
